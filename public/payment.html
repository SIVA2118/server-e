<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Razorpay Payment</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
  <h2>Razorpay Payment Demo</h2>
  <button id="payButton">Pay Now</button>

  <script>
    const JWT_TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjY5MmZlY2Y0ZTc0Nzk5ZjMyNGI4M2MxYyIsInJvbGUiOiJ1c2VyIiwiaWF0IjoxNzY1MzU0MjM0LCJleHAiOjE3NjU0NDA2MzR9.64sbqgTzx6UmeRRyCmjPr6kvC8OAWvgZDAi6cSz0aww";      
    const ORDER_ID = "69392b39f0619e820f95e183";

    document.getElementById("payButton").onclick = async function () {
      try {
        // 1️⃣ Create payment from backend
        const res = await fetch("https://server-e-fx6s.onrender.com/api/payments/create", {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            "token": JWT_TOKEN
          },
          body: JSON.stringify({ orderId: ORDER_ID })
        });

        const data = await res.json();

        if (!res.ok) {
          alert("Error creating payment: " + data.message);
          return;
        }

        // 2️⃣ Razorpay Checkout
        const options = {
          key: "rzp_test_RNjlc0vHMbznn4",    // ✔ TEST KEY (matches backend)
          amount: data.payment.amount * 100,
          currency: "INR",
          name: "Your Store",
          description: "Test Payment",
          order_id: data.razorpayOrder.id,
          handler: async function (response) {
            const verifyRes = await fetch("https://server-e-fx6s.onrender.com/api/payments/verify", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "token": JWT_TOKEN
              },
              body: JSON.stringify({
                razorpay_order_id: response.razorpay_order_id,
                razorpay_payment_id: response.razorpay_payment_id,
                razorpay_signature: response.razorpay_signature
              })
            });

            const verifyData = await verifyRes.json();
            alert("Payment Verified:\n" + JSON.stringify(verifyData, null, 2));
          },
          prefill: { 
            name: "Customer Name",
            email: "customer@example.com"
          },
          theme: { color: "#3399cc" }
        };

        const rzp = new Razorpay(options);
        rzp.open();

      } catch (err) {
        alert("Something went wrong: " + err.message);
      }
    };
  </script>
</body>
</html>
